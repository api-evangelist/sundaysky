  type: has_one
  via: connector selection
- from: DataField
  to: FieldMapping
  type: has_one
  via: dataField
- from: Video
  to: DataLibrary
  type: belongs_to
  via: data library selection
- from: Video
  to: Scene
  type: has_many
- from: Video
  to: Template
  type: belongs_to
  via: saved-as/created-from template
- from: Scene
  to: CTA
  type: has_many
- from: Scene
  to: MediaAsset
  type: has_many
- from: Video
  to: PlayerSession
  type: has_many
  via: SundaySky Video ID (programId)
- from: PlayerSession
  to: Account
  type: belongs_to
  via: accountId
- from: Video
  to: LandingPage
  type: has_one
- from: Video
  to: Report
  type: has_many

id_prefixes: []
id_prefix_note: >-
  SundaySky publishes no object-reference page and no id-prefix scheme. The
  observed identifiers are opaque numeric strings.

