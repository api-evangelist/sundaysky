  additions:
  - area: Amplify Analytics
    highlight: >-
      Track video performance across templates and accounts in Amplify, to
      compare engagement and identify top-performing content at scale.
  - area: Video Creation
    highlight: >-
      Animation Cues — sync visuals to specific points in the narration by
      placing cues in the script and binding text, media, or button
      placeholders to enter, focus, or exit at that point.
  - area: Collaboration
    highlight: >-
      Approval Workflow — admins define approval rules and editors route content
      to designated approvers for signoff before publishing.
  - area: Video Creation
    highlight: >-
      Script to Video — paste a narration script and AI produces a ready-to-edit
      draft with scenes, layouts, visuals, on-screen text, music, and voice.
