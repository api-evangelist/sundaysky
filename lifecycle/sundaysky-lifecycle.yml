deprecation:
  policy_url: https://help.sundaysky.com/hc/en-us/articles/360017881098-SundaySky-Customer-Support-Policy
  sunset_header: false
  formal_api_policy: false
  note: >-
    SundaySky publishes no API deprecation policy and does not document RFC 8594
    Sunset or Deprecation headers. What it does publish is a product-lifecycle
    posture in the help center: a "Legacy Users" documentation category is
    maintained for superseded platform generations, and a Customer Support
    Policy sets out support commitments. Recorded honestly as a product
    lifecycle signal, not an API deprecation contract.
  legacy_documentation: https://help.sundaysky.com/hc/en-us/categories/4402963580561-Legacy-Users

sla:
  url: https://help.sundaysky.com/hc/en-us/articles/360019944758-SundaySky-Service-SLA
  uptime_target: 99.8%
  measurement_window: Service Year (preceding 12 full calendar months from the SLA claim date)
  scope: Video Engine
  sampling_interval: 5 minutes
  unavailability_definition: >-
    A state where all SundaySky video requests are not fulfilled — not generated
    and not delivered from the Video Engine — during a five minute period, and
    all users are unable to watch such videos due to a malfunction of the Video
    Engine.
  scheduled_maintenance:
    recurring_window: Sunday 02:00 to Sunday 06:00 Eastern time, weekly
    additional_notice: >-
      Additional maintenance periods may be scheduled with at least two days
      notice to the customer.
    excluded_from_uptime: true
  remedy:
    type: service-credit
    amount: >-
      10% of the customer's monthly bill (excluding setup and other one-time
      fees) for the month in which the most recent Service Unavailable event
      included in the claim occurred.
    claim_model: customer-initiated
    claim_note: >-
      A claim may be filed any time the trailing 12-month Annual Uptime
      Percentage drops below 99.8%; the customer need not wait a full service
      year. Downtime used in a successful claim cannot be reused in a future
      claim. Credits apply to future payments only, are not refundable, and are
      not transferrable or assignable. The credit is the customer's sole and
      exclusive remedy.

