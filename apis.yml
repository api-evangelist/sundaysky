aid: sundaysky
name: SundaySky
description: 'SundaySky is an enterprise video personalization platform that uses AI to
  create, edit, and deliver dynamically personalized videos at scale. The platform lets
  organizations tailor video content to individual viewers using customer data and real-time
  rendering, serving customer experience, marketing, sales, and learning-and-development
  teams — with particular traction in regulated industries such as financial services,
  insurance, telecom, and healthcare. Its products include SundaySky Studio for content
  creation, the SundaySky Player, a Landing Page Builder, and analytics and reporting.
  SundaySky publishes one documented HTTP API — the SundaySky Video API, a storage-less
  POST endpoint at apis.sundaysky.com that accepts a flat JSON payload of viewer
  personalization fields and returns a base64 player session used to render a video in
  real time — alongside a data-connector marketplace (Salesforce, HubSpot, Snowflake,
  Databricks, Google Sheets, Marketo, file upload, URL parameters) and a client-side
  player web component with a documented browser event surface. There is no self-serve
  developer portal, no published OpenAPI, and no public pricing; platform access is sold
  and provisioned to enterprise customers. This profile was surfaced as a portfolio
  company of Norwest Venture Partners and enriched by the API Evangelist pipeline.'
