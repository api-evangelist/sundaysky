aid: sundaysky
name: SundaySky
description: 'SundaySky is an enterprise video personalization platform that uses AI to
  create, edit, and deliver dynamically personalized videos at scale. The platform lets
  organizations tailor video content to individual viewers using customer data and real-time
  rendering, serving customer experience, marketing, sales, and learning-and-development
  teams — with particular traction in regulated industries such as financial services,
  insurance, telecom, and healthcare. Its products include SundaySky Studio for content
  creation, the SundaySky Player, a Landing Page Builder, and analytics and reporting.
  The company operates a customer-facing help center and a public service status dashboard,
  but does not publish an open, self-serve developer API program; platform access is
  delivered to enterprise customers. This profile was surfaced as a portfolio company
  of Norwest Venture Partners and enriched by the API Evangelist pipeline.'
