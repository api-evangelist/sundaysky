apis:
- name: SundaySky Video API
  description: 'Storage-less HTTP API for real-time personalized video rendering. The
    caller POSTs a flat JSON object of viewer personalization fields (mapped in the
    SundaySky Studio data library) to the player-session endpoint for a given SundaySky
    Video ID; SundaySky renders a personalized video in real time and returns a base64
    string that the SundaySky player consumes, or that can be decoded to extract the
    video stream URL and captions URL for use in a third-party player. Personalization
    data is purged after the video is generated.'
