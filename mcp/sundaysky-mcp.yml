tools:
- name: create_personalized_video_session
  status: candidate
  description: >-
    Render a personalized video for one viewer and return the base64 player
    session, from which the video stream URL and captions URL can be decoded.
  source_operation: >-
    POST https://apis.sundaysky.com/get-video/player-session/{sundayskyVideoId}
  input_schema_note: >-
    Not fully specifiable. The request body is a FLAT JSON object whose keys are
    defined per-video by the customer in the Studio's Map Fields window — there
    is no global schema, and the valid key set differs for every SundaySky Video
    ID. A conformant MCP inputSchema would need
    {sundayskyVideoId: string} plus an open additionalProperties map, with the
    concrete field names resolved per video at configuration time. This is the
    core reason SundaySky's API does not lend itself to a generic tool
    definition.
  candidate_input_schema:
    type: object
    required:
    - sundayskyVideoId
    - personalization
    properties:
      sundayskyVideoId:
        type: string
        description: The SundaySky Video ID, found in the video's embed code snippet.
      personalization:
        type: object
        description: >-
          Flat map of JSON field name to value, matching the field mapping
          configured for this video. Case-sensitive.
        additionalProperties: true
      id:
        type: string
        description: >-
          Optional lowercase viewer identifier enabling per-viewer attribution
          in SundaySky reports.

